<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Administrator Sign In</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="icon" type="image/svg+xml" href="/assets/app-icon.svg" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <input type="file" id="global-image-file-picker" accept="image/*" hidden />

    <datalist id="news-category-presets">
      <option value="Release Update"></option>
      <option value="Security Advisory"></option>
      <option value="Tutorial &amp; Guide"></option>
      <option value="Performance Changelog"></option>
      <option value="Infrastructure News"></option>
      <option value="Announcement"></option>
    </datalist>

    <!-- ═══════════════════════════════════════════════════════════════════════
         1. RESTRICTED ADMINISTRATOR SIGN-IN GATE
         Zero environment variable names, zero hints, zero workspace DOM before auth
         ═══════════════════════════════════════════════════════════════════════ -->
    <div id="auth-overlay" class="auth-overlay">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-brand">
            <div class="auth-logo-mark" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <div>
              <div class="auth-title">Administrator Sign In</div>
              <div class="auth-subtitle">Restricted Workspace Access</div>
            </div>
          </div>
          <span class="auth-lock-pill">Protected</span>
        </div>

        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" data-auth-mode="credentials" role="tab" aria-selected="true">
            Email &amp; Password
          </button>
          <button type="button" class="auth-tab" data-auth-mode="apikey" role="tab" aria-selected="false">
            Access Key
          </button>
        </div>

        <div id="auth-error" class="auth-error" role="alert"></div>

        <form id="login-form" class="form-grid" autocomplete="on" novalidate>
          <div id="auth-credentials-group" class="form-grid">
            <div class="field">
              <label class="field-label" for="login-email">Administrator Email</label>
              <input
                type="email"
                id="login-email"
                class="input"
                placeholder="Enter administrator email"
                autocomplete="username"
                inputmode="email"
                autocapitalize="none"
                spellcheck="false"
              />
            </div>

            <div class="field">
              <label class="field-label" for="login-password">Password</label>
              <div class="password-input-wrap">
                <input
                  type="password"
                  id="login-password"
                  class="input"
                  placeholder="Enter password"
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  id="btn-toggle-login-pass"
                  class="btn btn-sm password-toggle-btn"
                  aria-label="Show or hide password"
                >
                  Show
                </button>
              </div>
            </div>
          </div>

          <div id="auth-apikey-group" class="form-grid" hidden>
            <div class="field">
              <label class="field-label" for="login-apikey">Administrator Access Key</label>
              <div class="password-input-wrap">
                <input
                  type="password"
                  id="login-apikey"
                  class="input"
                  placeholder="Enter secret access key"
                  autocomplete="off"
                />
                <button
                  type="button"
                  id="btn-toggle-login-apikey"
                  class="btn btn-sm password-toggle-btn"
                  aria-label="Show or hide access key"
                >
                  Show
                </button>
              </div>
            </div>
          </div>

          <button type="submit" id="btn-login-submit" class="btn btn-primary auth-submit-btn">
            Sign In to Workspace
          </button>
        </form>

        <div class="auth-footer">
          <a href="/" class="auth-back-link">&larr; Return to Public Website</a>
        </div>
      </div>
    </div>

    <!-- Authenticated Workspace Mount Point (Populated dynamically ONLY after verified login) -->
    <div id="cms-shell" class="cms-shell" hidden></div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/admin.js"></script>
  </body>
</html>
