<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Administrator Sign In</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="icon" type="image/svg+xml" href="/assets/app-icon.svg" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <input type="file" id="global-image-file-picker" accept="image/*" hidden />

    <datalist id="news-category-presets">
      <option value="Release Update"></option>
      <option value="Security Advisory"></option>
      <option value="Tutorial &amp; Guide"></option>
      <option value="Performance Changelog"></option>
      <option value="Infrastructure News"></option>
      <option value="Announcement"></option>
    </datalist>

    <!-- ═══════════════════════════════════════════════════════════════════════
         1. RESTRICTED ADMINISTRATOR SIGN-IN GATE
         Zero environment variable names, zero hints, zero workspace DOM before auth
         ═══════════════════════════════════════════════════════════════════════ -->
    <div id="auth-overlay" class="auth-overlay" data-checking="true">
      <div id="auth-checking-state" class="auth-checking-state" role="status" aria-live="polite">
        <span class="auth-checking-spinner" aria-hidden="true"></span>
        <span>Checking workspace session…</span>
      </div>

      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-brand">
            <div class="auth-logo-mark" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <div class="auth-heading-group">
              <h1 class="auth-title">Administrator Sign In</h1>
              <p class="auth-subtitle">Restricted workspace access</p>
            </div>
          </div>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Sign-in method">
          <button
            type="button"
            id="tab-auth-credentials"
            class="auth-tab active"
            data-auth-mode="credentials"
            role="tab"
            aria-selected="true"
            aria-controls="auth-credentials-group"
          >
            Email &amp; Password
          </button>
          <button
            type="button"
            id="tab-auth-apikey"
            class="auth-tab"
            data-auth-mode="apikey"
            role="tab"
            aria-selected="false"
            aria-controls="auth-apikey-group"
          >
            Access Key
          </button>
        </div>

        <div id="auth-error" class="auth-error" role="alert" aria-live="assertive"></div>

        <form id="login-form" class="form-grid auth-form" autocomplete="on" novalidate>
          <div id="auth-credentials-group" class="form-grid" role="tabpanel" aria-labelledby="tab-auth-credentials">
            <div class="field">
              <label class="field-label" for="login-email">Administrator Email</label>
              <input
                type="email"
                id="login-email"
                name="email"
                class="input auth-input"
                placeholder="name@company.com"
                autocomplete="username"
                inputmode="email"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                required
              />
            </div>

            <div class="field">
              <label class="field-label" for="login-password">Password</label>
              <div class="password-input-wrap">
                <input
                  type="password"
                  id="login-password"
                  name="password"
                  class="input auth-input"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  id="btn-toggle-login-pass"
                  class="btn btn-sm password-toggle-btn"
                  aria-label="Show or hide password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
            </div>
          </div>

          <div id="auth-apikey-group" class="form-grid" role="tabpanel" aria-labelledby="tab-auth-apikey" hidden>
            <div class="field">
              <label class="field-label" for="login-apikey">Administrator Access Key</label>
              <div class="password-input-wrap">
                <input
                  type="password"
                  id="login-apikey"
                  name="apiKey"
                  class="input auth-input"
                  placeholder="Enter secret access key"
                  autocomplete="off"
                />
                <button
                  type="button"
                  id="btn-toggle-login-apikey"
                  class="btn btn-sm password-toggle-btn"
                  aria-label="Show or hide access key"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
            </div>
          </div>

          <button type="submit" id="btn-login-submit" class="btn btn-primary auth-submit-btn">
            Sign In to Workspace
          </button>
        </form>

        <div class="auth-footer">
          <a href="/" class="auth-back-link">&larr; Return to Public Website</a>
        </div>
      </div>
    </div>

    <!-- Authenticated Workspace Mount Point (Populated dynamically ONLY after verified login) -->
    <div id="cms-shell" class="cms-shell" hidden></div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/admin.js"></script>
  </body>
</html>
