  <style>:root{--accent-color:#ef4444;--bg-page:#f8fafc;--bg-surface:#fff;--border-color:#e2e8f0;--text-main:#1f2937;--heading-color:#0f172a;--font-stack:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif}*,:before,:after{box-sizing:border-box;margin:0;padding:0}html,body{overscroll-behavior-x:none;touch-action:pan-y;width:100%;max-width:100%;font-family:var(--font-stack);background-color:var(--bg-page);color:var(--text-main);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip}.gateway-viewport{flex-direction:column;justify-content:space-between;width:100%;max-width:520px;min-height:100vh;margin:0 auto;padding:0 16px;display:flex}.gateway-header{border-bottom:1px solid var(--border-color);justify-content:space-between;align-items:center;gap:12px;height:60px;display:flex}.gateway-brand-link{color:var(--heading-color);align-items:center;gap:9px;min-width:0;font-size:17px;font-weight:800;text-decoration:none;display:inline-flex}.gateway-brand-logo{object-fit:contain;flex-shrink:0;width:30px;height:30px}.back-home-pill{color:#475569;border:1px solid var(--border-color);background-color:#fff;border-radius:8px;flex-shrink:0;align-items:center;gap:5px;padding:6px 11px;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex}.back-home-pill:hover{color:var(--heading-color);border-color:#cbd5e1}.gateway-main{flex-direction:column;flex:1;justify-content:center;padding:28px 0;display:flex}.security-card{border:1px solid var(--border-color);background-color:var(--bg-surface);text-align:center;border-radius:16px;padding:26px 22px;box-shadow:0 8px 24px -6px #0f172a0f}.app-summary-col{flex-direction:column;align-items:center;gap:10px;margin-bottom:20px;display:flex}.app-summary-icon{object-fit:contain;border:1px solid var(--border-color);background-color:#f8fafc;border-radius:14px;width:64px;height:64px;padding:8px}.app-summary-title{color:var(--heading-color);font-size:20px;font-weight:800;line-height:1.25}.app-summary-meta{color:#64748b;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;font-size:13px;display:inline-flex}.custom-note-box{color:#334155;border:1px solid var(--border-color);text-align:left;background-color:#f8fafc;border-radius:10px;margin-bottom:18px;padding:12px 14px;font-size:14px;line-height:1.6}.turnstile-box{flex-direction:column;justify-content:center;align-items:center;min-height:68px;margin-bottom:18px;display:flex;overflow:hidden}.clearance-btn{letter-spacing:.04em;text-transform:uppercase;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;border:none;border-radius:10px;justify-content:center;align-items:center;gap:10px;width:100%;min-height:52px;font-size:15px;font-weight:800;transition:background-color .2s,transform .1s,opacity .2s;display:inline-flex}.clearance-btn.state-wait{color:#fff;cursor:not-allowed;opacity:.9;background-color:#94a3b8}.clearance-btn.state-ready{color:#fff;background-color:#16a34a;box-shadow:0 6px 16px #16a34a40}.clearance-btn.state-ready:active{transform:scale(.99)}.clearance-btn.state-busy{color:#fff;cursor:wait;background-color:#0f172a}.spinner-ring{border:2.5px solid #ffffff59;border-top-color:#fff;border-radius:50%;width:18px;height:18px;animation:.75s linear infinite gateway-spin}@keyframes gateway-spin{to{transform:rotate(360deg)}}.gateway-notice-box{text-align:left;border-radius:10px;margin-top:14px;padding:13px 15px;font-size:13.5px;line-height:1.5}.gateway-notice-box.amber{color:#92400e;background-color:#fffbeb;border:1px solid #fde68a}.gateway-notice-box.emerald{color:#065f46;background-color:#ecfdf5;border:1px solid #a7f3d0}.helpline-actions{flex-wrap:wrap;gap:10px;margin-top:10px;display:flex}.helpline-btn{color:#fff;border-radius:8px;align-items:center;gap:6px;padding:8px 14px;font-size:13px;font-weight:700;text-decoration:none;display:inline-flex}.helpline-btn.whatsapp{background-color:#16a34a}.helpline-btn.telegram{background-color:#0284c7}.specs-card{border:1px solid var(--border-color);background-color:#fff;border-radius:12px;margin-top:16px;padding:16px}.specs-table{border-collapse:collapse;width:100%;font-size:13px}.specs-table th,.specs-table td{text-align:left;border:1px solid #e2e8f0;padding:8px 10px}.specs-table th{color:#334155;background-color:#f8fafc;width:38%;font-weight:600}.specs-table code{word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11.5px}.disguised-404-view{text-align:center;flex-direction:column;justify-content:center;align-items:center;min-height:85vh;padding:32px 20px;display:flex}.disguised-404-code{color:#e2e8f0;margin-bottom:12px;font-size:64px;font-weight:900;line-height:1}.disguised-404-title{color:#334155;margin-bottom:8px;font-size:20px;font-weight:700}.disguised-404-desc{color:#64748b;max-width:340px;margin-bottom:20px;font-size:14px;line-height:1.5}.gateway-footer{text-align:center;color:#64748b;border-top:1px solid var(--border-color);padding:18px 0;font-size:12.5px}.hidden{display:none!important}</style>

<body>
  <div class="gateway-viewport" id="gateway-root">
    <div id="gateway-active-view" style="display:flex; flex-direction:column; min-height:100vh; justify-content:space-between;">
      <header class="gateway-header">
        <a href="/" class="gateway-brand-link" id="gw-brand-link">
          <img id="gw-brand-logo" class="gateway-brand-logo hidden" src="" alt="" width="30" height="30" />
          <span id="gw-brand-name"></span>
        </a>
        <a href="/" class="back-home-pill" id="gw-back-home">← Back</a>
      </header>

      <main class="gateway-main">
        <section class="security-card">
          <div class="app-summary-col">
            <img id="gw-app-icon" class="app-summary-icon hidden" src="" alt="" width="64" height="64" />
            <h1 class="app-summary-title" id="gw-app-title"></h1>
            <div class="app-summary-meta" id="gw-app-meta">
              <span id="gw-app-version"></span>
              <span id="gw-app-meta-dot" class="hidden">·</span>
              <span id="gw-app-size"></span>
            </div>
          </div>

          <div id="gw-custom-note" class="custom-note-box hidden"></div>

          <div class="turnstile-box" id="gw-turnstile-box">
            <div id="turnstile-widget-slot"></div>
          </div>

          <button
            type="button"
            id="gw-clearance-btn"
            class="clearance-btn state-wait"
            disabled
            aria-busy="true"
          >
            <span class="spinner-ring" id="gw-btn-spinner"></span>
            <span id="gw-btn-label">PLEASE WAIT…</span>
          </button>

          <div id="gw-notice-box" class="gateway-notice-box amber hidden">
            <div id="gw-notice-text"></div>
            <div id="gw-helpline-row" class="helpline-actions hidden"></div>
          </div>
        </section>

        <section class="specs-card hidden" id="gw-specs-card">
          <table class="specs-table">
            <tbody>
              <tr>
                <th>Application</th>
                <td id="gw-spec-name"></td>
              </tr>
              <tr>
                <th>Version &amp; Size</th>
                <td id="gw-spec-ver-size"></td>
              </tr>
              <tr>
                <th>System</th>
                <td id="gw-spec-os"></td>
              </tr>
              <tr>
                <th>SHA-256</th>
                <td><code id="gw-spec-sha256"></code></td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>

      <footer class="gateway-footer">
        <span id="gw-footer-copyright"></span>
      </footer>
    </div>

    <div id="gateway-disguised-404" class="disguised-404-view hidden">
      <div class="disguised-404-code">404</div>
      <h1 class="disguised-404-title">Page Not Found</h1>
      <p class="disguised-404-desc">
        The page you are looking for doesn't exist, has expired, or has been moved.
      </p>
      <a href="/" class="back-home-pill">← Return to Home Page</a>
    </div>
  </div>

</body>
</html>
